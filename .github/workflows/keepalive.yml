name: Keep Supabase awake
on:
  schedule:
    - cron: "0 3 */3 * *"   # every 3 days
  workflow_dispatch:         # lets you run it manually to test
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/eateries?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"